<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>珊瑚音乐 · Coral Music</title>
  <meta name="description" content="一个纯静态、可部署到 Cloudflare Pages 的在线音乐播放器" />
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%8D%8A%3C/text%3E%3C/svg%3E" />
  <meta name="theme-color" content="#ff7a45" />
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="apple-touch-icon" href="icon.svg" />
  <link rel="stylesheet" href="css/style.css" />
  <!-- 防止深色模式闪烁：在样式应用前先读偏好 -->
  <script>
    (function () {
      try {
        var t = localStorage.getItem('cm-theme');
        if (t) document.documentElement.setAttribute('data-theme', t);
        else if (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches)
          document.documentElement.setAttribute('data-theme', 'dark');
      } catch (e) {}
    })();
  </script>
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <span class="brand-logo">🍊</span>
      <span class="brand-name">珊瑚音乐</span>
    </div>
    <div class="topbar-actions">
      <button id="btn-upload" class="btn btn-primary" title="从电脑上传音乐（持久化到浏览器）">＋ 上传音乐</button>
      <button id="btn-add-url" class="btn" title="通过链接添加远程歌曲">🔗 添加链接</button>
      <button id="btn-online" class="btn" title="搜索并播放在线音乐（Audius，免 key，需联网）">🌐 在线音乐</button>
      <button id="btn-load-samples" class="btn" title="载入内置示例曲">🎵 示例曲</button>
      <button id="btn-export" class="btn" title="导出歌单/远程歌曲/歌词为 JSON 备份">⤓ 备份</button>
      <button id="btn-import" class="btn" title="从 JSON 备份恢复歌单">⤒ 恢复</button>
      <button id="btn-eq" class="btn" title="均衡器（仅本地歌曲生效）">🎚 EQ</button>
      <button id="btn-rate" class="btn" title="倍速播放">⏩ 倍速</button>
      <button id="btn-sleep" class="btn" title="睡眠定时">⏲ 定时</button>
      <button id="btn-desktop-lyrics" class="btn" title="桌面浮动歌词">🖥 桌面词</button>
      <button id="btn-theme" class="btn btn-icon" title="切换深色 / 浅色">🌙</button>
    </div>
  </header>

  <main class="layout">
    <!-- 曲库 / 歌单 -->
    <section class="panel playlist-panel">
      <div class="panel-head">
        <h2>曲库</h2>
        <div class="playlist-tools">
          <button id="btn-shuffle" class="chip" title="随机播放">🔀</button>
          <button id="btn-repeat" class="chip" title="循环模式：关 / 单曲 / 列表">🔁</button>
        </div>
      </div>
      <div class="list-bar">
        <div id="list-tabs" class="list-tabs"></div>
        <button id="btn-new-list" class="chip" title="新建歌单">＋</button>
      </div>
      <div class="search-wrap">
        <input id="search" class="search" type="text" placeholder="🔍 搜索歌名 / 歌手" />
      </div>
      <ul id="playlist" class="playlist"></ul>
      <p id="playlist-empty" class="empty-hint">列表空空如也～ 点击右上角「上传音乐」或「示例曲」开始吧</p>
    </section>

    <!-- 正在播放 -->
    <section class="panel now-panel">
      <div class="cover-wrap">
        <canvas id="visualizer" class="visualizer"></canvas>
        <div id="cover" class="cover" aria-label="封面">
          <span class="cover-note">🍊</span>
        </div>
      </div>
      <div class="now-meta">
        <h1 id="track-title" class="track-title">未在播放</h1>
        <p id="track-artist" class="track-artist">选择一首歌开始享受</p>
      </div>

      <div class="progress-row">
        <span id="time-current" class="time">0:00</span>
        <input id="seek" class="seek" type="range" min="0" max="1000" value="0" step="1" />
        <span id="time-total" class="time">0:00</span>
      </div>

      <div class="controls">
        <button id="btn-prev" class="ctrl" title="上一首">⏮</button>
        <button id="btn-play" class="ctrl ctrl-main" title="播放 / 暂停">▶</button>
        <button id="btn-next" class="ctrl" title="下一首">⏭</button>
        <div class="volume">
          <span class="vol-icon">🔊</span>
          <input id="volume" class="vol-slider" type="range" min="0" max="100" value="80" />
        </div>
        <button id="btn-lyrics" class="ctrl ctrl-side" title="歌词">词</button>
        <button id="btn-queue-tab" class="ctrl ctrl-side" title="播放队列">列</button>
      </div>
    </section>

    <!-- 侧栏：歌词 / 队列 -->
    <section class="panel side-panel">
      <div class="panel-tabs">
        <button class="panel-tab active" data-panel="lyrics">歌词</button>
        <button class="panel-tab" data-panel="queue">队列</button>
      </div>
      <div id="lyrics-view" class="side-view">
        <div class="panel-head">
          <h2>歌词</h2>
          <label class="offset-ctl" title="歌词整体时间偏移（毫秒），补偿手写 LRC 快慢">
            偏移 <input id="lyric-offset" type="range" min="-5000" max="5000" step="100" value="0" /> <span id="lyric-offset-val">0.0s</span>
          </label>
          <button id="btn-lyrics-match" class="chip" title="按歌名/歌手在线自动匹配歌词（需联网）">🔍 匹配</button>
          <button id="btn-lyrics-edit" class="chip" title="为当前歌曲粘贴 LRC 歌词">✎ 编辑</button>
        </div>
        <div id="lyrics" class="lyrics"><p class="lyrics-empty">暂无歌词。点击「编辑」粘贴 LRC 文本，或添加链接时填写歌词地址。</p></div>
      </div>
      <div id="queue-view" class="side-view hidden">
        <div class="panel-head">
          <h2>播放队列</h2>
          <button id="btn-queue-clear" class="chip" title="清空队列">🗑</button>
        </div>
        <ul id="queue" class="queue"></ul>
        <p id="queue-empty" class="empty-hint">队列为空。在左侧歌曲点 ⋮ 选择「加入队列」。</p>
      </div>
    </section>
  </main>

  <!-- 隐藏的文件选择器 -->
  <input id="file-input" type="file" accept="audio/*" multiple class="hidden" />
  <!-- 隐藏的导入备份选择器 -->
  <input id="import-input" type="file" accept="application/json,.json" class="hidden" />

  <!-- 添加链接弹窗 -->
  <div id="url-modal" class="modal hidden">
    <div class="modal-card">
      <h3>添加远程歌曲</h3>
      <label>歌曲链接（mp3 / m4a 等直链）</label>
      <input id="url-input" type="text" placeholder="https://example.com/song.mp3" />
      <label>标题（可选）</label>
      <input id="url-title" type="text" placeholder="歌曲名" />
      <label>歌手（可选）</label>
      <input id="url-artist" type="text" placeholder="歌手" />
      <label>歌词 LRC 链接（可选）</label>
      <input id="url-lrc" type="text" placeholder="https://example.com/song.lrc" />
      <div class="modal-actions">
        <button id="url-cancel" class="btn">取消</button>
        <button id="url-ok" class="btn btn-primary">添加</button>
      </div>
    </div>
  </div>

  <!-- 在线音乐弹窗（Audius） -->
  <div id="online-modal" class="modal hidden">
    <div class="modal-card online-card">
      <h3>🌐 在线音乐 · Audius</h3>
      <div class="online-search-row">
        <input id="online-query" type="text" placeholder="输入歌名 / 艺术家 / 关键词，回车搜索" />
        <button id="online-search" class="btn btn-primary">搜索</button>
      </div>
      <p id="online-status" class="online-status"></p>
      <div id="online-results" class="online-results"></div>
      <div class="modal-actions">
        <button id="online-close" class="btn">关闭</button>
      </div>
    </div>
  </div>

  <!-- 歌词编辑弹窗 -->
  <div id="lrc-modal" class="modal hidden">
    <div class="modal-card">
      <h3>编辑歌词（LRC 格式）</h3>
      <textarea id="lrc-input" rows="12" placeholder="[00:00.00] 作词 : xxx&#10;[00:04.50] 第一句歌词&#10;[00:09.00] 第二句歌词"></textarea>
      <div class="modal-actions">
        <button id="lrc-cancel" class="btn">取消</button>
        <button id="lrc-ok" class="btn btn-primary">保存</button>
      </div>
    </div>
  </div>

  <!-- EQ 弹窗 -->
  <div id="eq-modal" class="modal hidden">
    <div class="modal-card">
      <h3>均衡器（仅本地歌曲生效）</h3>
      <label>低频 <span id="eq-low-val" class="eq-val">0</span> dB</label>
      <input id="eq-low" class="eq-slider" type="range" min="-12" max="12" value="0" step="1" />
      <label>中频 <span id="eq-mid-val" class="eq-val">0</span> dB</label>
      <input id="eq-mid" class="eq-slider" type="range" min="-12" max="12" value="0" step="1" />
      <label>高频 <span id="eq-high-val" class="eq-val">0</span> dB</label>
      <input id="eq-high" class="eq-slider" type="range" min="-12" max="12" value="0" step="1" />
      <div class="modal-actions">
        <button id="eq-reset" class="btn">重置</button>
        <button id="eq-close" class="btn btn-primary">完成</button>
      </div>
    </div>
  </div>

  <!-- 倍速弹窗 -->
  <div id="rate-modal" class="modal hidden">
    <div class="modal-card">
      <h3>倍速播放</h3>
      <div class="rate-grid">
        <button class="rate-opt" data-rate="0.5">0.5x</button>
        <button class="rate-opt" data-rate="0.75">0.75x</button>
        <button class="rate-opt" data-rate="1">1.0x（正常）</button>
        <button class="rate-opt" data-rate="1.25">1.25x</button>
        <button class="rate-opt" data-rate="1.5">1.5x</button>
        <button class="rate-opt" data-rate="2">2.0x</button>
      </div>
      <div class="modal-actions">
        <button id="rate-close" class="btn btn-primary">完成</button>
      </div>
    </div>
  </div>

  <!-- 睡眠定时弹窗 -->
  <div id="sleep-modal" class="modal hidden">
    <div class="modal-card">
      <h3>睡眠定时</h3>
      <div class="sleep-grid">
        <button class="sleep-opt" data-min="off">关闭</button>
        <button class="sleep-opt" data-min="15">15 分钟</button>
        <button class="sleep-opt" data-min="30">30 分钟</button>
        <button class="sleep-opt" data-min="60">60 分钟</button>
        <button class="sleep-opt" data-min="trackEnd">本曲播完停止</button>
      </div>
      <div class="modal-actions">
        <button id="sleep-close" class="btn btn-primary">完成</button>
      </div>
    </div>
  </div>

  <!-- 桌面浮动歌词 -->
  <div id="desktop-lyrics" class="desktop-lyrics hidden"></div>

  <div id="toast" class="toast hidden"></div>

  <script src="js/storage.js"></script>
  <script src="js/samples.js"></script>
  <script src="js/lyrics.js"></script>
  <script src="js/online.js"></script>
  <script src="js/visualizer.js"></script>
  <script src="js/id3.js"></script>
  <script src="js/library.js"></script>
  <script src="js/player.js"></script>
  <script src="js/playlist.js"></script>
  <script src="js/queue.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
